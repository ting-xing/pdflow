<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- PDFlow 图标：蓝色文档 + "P" 字母 -->
  <defs>
    <linearGradient id="fg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
  </defs>
  <!-- 文档轮廓 -->
  <rect x="2" y="1" width="24" height="28" rx="3" fill="url(#fg)"/>
  <!-- 折角效果 -->
  <path d="M20 1 L20 7 Q20 9 22 9 L26 9" fill="none" stroke="white" stroke-width="1.5" opacity="0.5"/>
  <path d="M20 6 L24 6 L24 2" fill="white" opacity="0.3"/>
  <!-- 文字行 -->
  <rect x="7" y="8" width="10" height="2" rx="1" fill="white" opacity="0.9"/>
  <rect x="7" y="12" width="14" height="2" rx="1" fill="white" opacity="0.7"/>
  <rect x="7" y="16" width="9" height="2" rx="1" fill="white" opacity="0.5"/>
  <rect x="7" y="20" width="12" height="2" rx="1" fill="white" opacity="0.4"/>
  <!-- P 字母 -->
  <text x="11.5" y="22" fill="white" font-size="13" font-weight="800" font-family="system-ui, sans-serif">P</text>
</svg>