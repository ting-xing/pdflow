# =============================================================
# PDFlow — docker-compose.yml
#
# 两个 profile，二选一：
#   docker compose --profile remote up -d   # 拉取 GitHub 镜像
#   docker compose --profile local build    # 本地构建
#   docker compose --profile local up -d    # 本地构建 + 启动
# =============================================================
version: "3.9"

services:
  # ---- remote：GitHub Container Registry 镜像 ----
  pdflow-remote:
    image: ghcr.io/ting-xing/pdflow:latest
    container_name: pdflow
    restart: unless-stopped
    profiles: ["remote"]

    ports:
      - "3000:3000"

    volumes:
      - pdflow_uploads:/app/uploads
      - pdflow_outputs:/app/outputs

    environment:
      NITRO_HOST: "0.0.0.0"
      NITRO_PORT: "3000"
      MINERU_API_URL: ${MINERU_API_URL}
      LLM_API_URL: ${LLM_API_URL}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_MODEL: ${LLM_MODEL}

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ---- local：本地 Dockerfile 构建 ----
  pdflow-local:
    build:
      context: .
      dockerfile: Dockerfile
    image: pdflow:local
    container_name: pdflow
    restart: unless-stopped
    profiles: ["local"]

    ports:
      - "3000:3000"

    volumes:
      - pdflow_uploads:/app/uploads
      - pdflow_outputs:/app/outputs

    environment:
      NITRO_HOST: "0.0.0.0"
      NITRO_PORT: "3000"
      MINERU_API_URL: ${MINERU_API_URL}
      LLM_API_URL: ${LLM_API_URL}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_MODEL: ${LLM_MODEL}

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  pdflow_uploads:
    driver: local
  pdflow_outputs:
    driver: local